aid: zomentum
name: Zomentum
description: >-
  Zomentum is an AI-powered revenue platform built for managed service providers
  (MSPs) and IT service businesses, unifying proposal and quote creation,
  contracts and e-signatures, an MSP-focused CRM, workflow automation, and
  integrated payment collection into a single "Turn Every Proposal Into Revenue"
  workflow. Founded in 2018 (legal entity Pactora Inc) and headquartered in San
  Francisco, Zomentum connects to 50+ PSA, accounting, and distributor systems —
  including Autotask, ConnectWise Manage, HaloPSA, Syncro, QuickBooks, and Xero —
  and exposes a REST API, documented via Postman at api-docs.zomentum.com and
  served from api.zomentum.com, that uses Bearer token authentication (Auth0-issued
  access and refresh tokens) provisioned through an API User in the dashboard and
  available on the Growth plan.
